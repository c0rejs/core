version: 2
registries:
  npm.pkg.github.com:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: cron
      cronjob: 0 0 * * *
      timezone: UTC
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
