server {
<% if ( localAddress ) { -%>
    listen                  "<%- localAddress %>"<%- listenOptions %>;
<% } else { -%>
<% if ( nginx.listenIpV4 ) { -%>
    listen                  *:<%- server.port %><%- server.getListenOptions() %>;
<% } -%>
<% if ( nginx.listenIpV6 ) { -%>
    listen                  [::]:<%- server.port %><%- server.getListenOptions() %>;
<% } -%>
<% } -%>

    ssl_reject_handshake    on;
}
