server {
<% if ( localAddress ) { -%>
    listen                  "<%- localAddress %>" default_server reuseport multipath ssl;
<% } else { -%>
<% if ( nginx.listenIpV4 ) { -%>
    listen                  *:<%- server.port %> default_server reuseport multipath ssl;
<% } -%>
<% if ( nginx.listenIpV6 ) { -%>
    listen                  [::]:<%- server.port %> default_server reuseport multipath ssl;
<% } -%>
<% } -%>

    ssl_reject_handshake    on;
}
