server {
<% for ( const option of listen ) { -%>
    listen                  <%- option %>;
<% } -%>
<% if ( server.useSsl ) { -%>

    ssl_reject_handshake    on;
<% } else { -%>

    real_ip_header          <%- server.useProxyProtocol ? "proxy_protocol" : nginx.config.realIpHeader %>;

    location / {
        return              444;
    }
<% if ( server.acmeLocation ) { -%>

    location <%- nginx.app.acme.httpLocation %> {
        proxy_pass          "http://<%- nginx.privateHrrpServerUpstream %>";
    }
<% } -%>
<% } -%>
}
