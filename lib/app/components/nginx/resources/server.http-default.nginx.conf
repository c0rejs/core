server {
<% if ( localAddress ) { -%>
    listen                  "<%- localAddress %>"<%- server.listenOptions %>;
<% } else { -%>
<% if ( nginx.listenIpV4 ) { -%>
    listen                  *:<%- server.port %><%- server.listenOptions %>;
<% if ( server.useQuic ) { -%>
    listen                  *:<%- server.port %><%- server.listenOptionsQuic %>;
<% } -%>
<% } -%>
<% if ( nginx.listenIpV6 ) { -%>
    listen                  [::]:<%- server.port %><%- server.listenOptions %>;
<% if ( server.useQuic ) { -%>
    listen                  [::]:<%- server.port %><%- server.listenOptionsQuic %>;
<% } -%>
<% } -%>
<% } -%>
<% if ( server.ssl ) { -%>

    ssl_reject_handshake    on;
<% } else { -%>

    real_ip_header          <%- server.proxyProtocol ? "proxy_protocol" : nginx.config.realIpHeader %>;

    location / {
        return              444;
    }
<% if ( server.acmeLocation ) { -%>

    location <%- nginx.app.acme.httpLocation %> {
        proxy_pass          "http://<%- nginx.privateHrrpServerUpstream %>";
    }
<% } -%>
<% } -%>
}
