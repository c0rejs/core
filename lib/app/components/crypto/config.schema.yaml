- $id: config
  type: object
  properties:
    algorithm: { type: string }
    key: { type: ["null", string] }
    useLocalKeyring: { type: boolean }

    passwordHash:
      type: object
      properties:
        preset:
          enum:
            - argon2
            - argon2-rfc-9106-2GiB
            - argon2-rfc-9106-64MiB
            - argon2d
            - argon2i
            - argon2id
            - openssl
            - owasp
            - owasp-argon2
            - owasp-argon2-12MiB
            - owasp-argon2-19MiB
            - owasp-argon2-46MiB
            - owasp-argon2-7MiB
            - owasp-argon2-9MiB
            - owasp-pbkdf2
            - owasp-pbkdf2-sha1
            - owasp-pbkdf2-sha256
            - owasp-pbkdf2-sha512
            - owasp-scrypt
            - owasp-scrypt-128MiB
            - owasp-scrypt-16MiB
            - owasp-scrypt-32MiB
            - owasp-scrypt-64MiB
            - owasp-scrypt-8MiB
            - pbkdf2
            - pbkdf2-sha1
            - pbkdf2-sha256
            - pbkdf2-sha512
            - scrypt

      additionalProperties: false
      required: [preset]

  additionalProperties: false
  required: [algorithm, key, useLocalKeyring, passwordHash]
